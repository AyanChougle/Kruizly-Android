name: kruizly
description: "KRUIZLY - Premium Self-Drive Car Rentals Native Flutter App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.4.3+1
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.2.3
  cached_network_image: ^3.4.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  flutter_pdfview: ^1.3.2
  share_plus: ^9.0.0
  path_provider: ^2.1.4
  video_player: ^2.14.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fleet/
    - assets/images/
    - assets/icons/
